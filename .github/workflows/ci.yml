name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
      - name: Test
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Validate manifests and static invariants
        run: bun run static
