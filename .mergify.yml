merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: null
    merge_method: merge
    queue_conditions:
      - -draft
      - check-success=verify
      - check-success=Unfret
      - check-success=live-gate
    merge_conditions: []

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    # Workflow changes never auto-queue; the operator queues them by hand.
    - -files~=^\.github/

merge_protections:
  - name: Queue ready pull requests
    description: Automatically queue non-draft pull requests targeting main after verify, Unfret, and live-gate pass on the head.
    if:
      - base = main
    success_conditions:
      - -draft
      - check-success=verify
      - check-success=Unfret
      - check-success=live-gate

commands_restrictions:
  requeue:
    conditions:
      - sender-permission >= write
